name: Build AutoLineArt APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: |
          mkdir work
          unzip -o AutoLineArt.zip -d work
          echo "Isi folder proyek:"
          find work -maxdepth 3 -type f | head -80

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd work
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoLineArt-debug-apk
          path: work/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
