name: Build AutoLineArt from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoLineArt.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract AutoLineArt.zip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p project
          unzip -o AutoLineArt.zip -d project
          echo "ZIP extracted successfully"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          if [ -f project/gradlew ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f project/AutoLineArt/gradlew ]; then
            echo "PROJECT_DIR=project/AutoLineArt" >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLineArt-debug-apk
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
