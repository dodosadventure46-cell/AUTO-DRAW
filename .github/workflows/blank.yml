name: Build APK dari ZIP
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip otomatis
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Pakai: $ZIP"
          mkdir -p /tmp/src && unzip -q "$ZIP" -d /tmp/src
          ROOT=$(dirname "$(find /tmp/src -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDraw-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
